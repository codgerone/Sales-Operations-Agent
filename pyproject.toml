[project]
name = "sales-operations-agent"
version = "1.1.0"
description = "面向海外销售运营的项目管理 Agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.12,<3",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
sales-ops = "sales_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_ops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]
