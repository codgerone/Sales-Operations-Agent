# 本机开发用 PostgreSQL。账号与密码只用于本机，与 .env.example 一致。
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: sales_ops
      POSTGRES_PASSWORD: sales_ops_dev
      POSTGRES_DB: sales_ops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_ops -d sales_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
